<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>آرال — ارسال پیام</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0e0e12);
      --text: var(--tg-theme-text-color, #f4f4f5);
      --hint: var(--tg-theme-hint-color, #8b8b96);
      --btn: var(--tg-theme-button-color, #2aabee);
      --btn-text: var(--tg-theme-button-text-color, #fff);
      --sec: var(--tg-theme-secondary-bg-color, #1a1a22);
      --me: #1b6ca8;
      --bot: #25252f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, Tahoma, sans-serif;
      background: var(--bg); color: var(--text);
      height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
    }
    header {
      padding: 14px 16px 10px; background: var(--sec);
      border-bottom: 1px solid rgba(255,255,255,0.06);
    }
    header h1 { font-size: 17px; font-weight: 700; }
    header p { font-size: 12px; color: var(--hint); margin-top: 6px; line-height: 1.55; }
    header code { background: rgba(255,255,255,0.08); padding: 1px 6px; border-radius: 6px; font-size: 11px; }
    #chat { flex: 1; overflow-y: auto; padding: 14px 12px; display: flex; flex-direction: column; gap: 10px; }
    .msg {
      max-width: 90%; padding: 11px 13px; border-radius: 16px; font-size: 14.5px;
      line-height: 1.55; white-space: pre-wrap; word-break: break-word;
    }
    .msg.bot { align-self: flex-start; background: var(--bot); border-bottom-right-radius: 5px; }
    .msg.me { align-self: flex-end; background: var(--me); border-bottom-left-radius: 5px; }
    .msg .meta { font-size: 11px; color: var(--hint); margin-top: 6px; }
    .composer {
      display: flex; gap: 8px; padding: 10px 12px calc(12px + env(safe-area-inset-bottom));
      background: var(--sec); border-top: 1px solid rgba(255,255,255,0.06); align-items: flex-end;
    }
    #input {
      flex: 1; resize: none; border: none; border-radius: 14px; padding: 12px 14px;
      font-size: 15px; font-family: inherit; background: var(--bg); color: var(--text);
      min-height: 48px; max-height: 140px; outline: none;
    }
    #send {
      border: none; border-radius: 14px; height: 48px; padding: 0 18px;
      background: var(--btn); color: var(--btn-text); font-weight: 700; font-size: 14px; min-width: 72px;
    }
    #send:disabled { opacity: 0.45; }
  </style>
</head>
<body>
  <header>
    <h1>ارسال پیام آرال</h1>
    <p>
      با <code>صدام بزن</code> / <code>این کاربر</code> / <code>تو زندگی بعدی</code> شروع کنید،
      بدون لینک و ایموجی، با نقطه تمام شود. حداکثر ۶ در ۱۰ دقیقه · فقط وقتی شیفت فعال است.
    </p>
  </header>
  <div id="chat"></div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="صدام بزن آ مهتی چون دوستت دارم ."></textarea>
    <button type="button" id="send">ارسال</button>
  </div>
  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) { tg.ready(); tg.expand(); try { tg.setHeaderColor('secondary_bg_color'); } catch (e) {} }
    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');
    function addMsg(text, who, meta) {
      const el = document.createElement('div');
      el.className = 'msg ' + (who === 'me' ? 'me' : 'bot');
      el.textContent = text;
      if (meta) { const m = document.createElement('div'); m.className = 'meta'; m.textContent = meta; el.appendChild(m); }
      chat.appendChild(el); chat.scrollTop = chat.scrollHeight;
    }
    addMsg('سلام\nپیامت را بنویس و بفرست.\n\nنمونه:\nصدام بزن آ مهتی چون دوستت دارم .', 'bot');
    function callEndpoint(name, payload) {
      return new Promise(function (resolve, reject) {
        if (!tg || !tg.Serverless || typeof tg.Serverless.call !== 'function') {
          reject(new Error('فقط از داخل ربات تلگرام (منوی کنار کادر تایپ) باز کنید.'));
          return;
        }
        tg.Serverless.call(name, payload || {}, function (err, result) {
          if (err) reject(new Error((err && err.message) || 'خطا'));
          else resolve(result);
        });
      });
    }
    async function send() {
      const text = (input.value || '').trim();
      if (!text) return;
      sendBtn.disabled = true;
      addMsg(text, 'me');
      input.value = '';
      try {
        const res = await callEndpoint('submitMessage', { text: text });
        addMsg(res.message || ('ثبت شد #' + res.msgId), 'bot');
      } catch (err) {
        addMsg('❌ ' + (err.message || 'خطا'), 'bot');
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }
    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
    });
  </script>
</body>
</html>
