<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>آرال — ارسال پیام</title>
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    :root {
      --bg: var(--tg-theme-bg-color, #0f0f12);
      --text: var(--tg-theme-text-color, #f2f2f2);
      --hint: var(--tg-theme-hint-color, #8a8a96);
      --btn: var(--tg-theme-button-color, #2aabee);
      --btn-text: var(--tg-theme-button-text-color, #fff);
      --sec: var(--tg-theme-secondary-bg-color, #1c1c22);
      --bubble-me: #2a6f97;
      --bubble-bot: #2a2a32;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: system-ui, -apple-system, 'Segoe UI', Tahoma, sans-serif;
      background: var(--bg);
      color: var(--text);
      height: 100dvh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    header {
      padding: 12px 16px 8px;
      border-bottom: 1px solid rgba(255,255,255,0.06);
      background: var(--sec);
    }
    header h1 { font-size: 16px; font-weight: 600; }
    header p { font-size: 12px; color: var(--hint); margin-top: 4px; line-height: 1.5; }
    #chat {
      flex: 1;
      overflow-y: auto;
      padding: 12px 12px 8px;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .msg {
      max-width: 88%;
      padding: 10px 12px;
      border-radius: 14px;
      font-size: 14px;
      line-height: 1.55;
      white-space: pre-wrap;
      word-break: break-word;
    }
    .msg.bot {
      align-self: flex-start;
      background: var(--bubble-bot);
      border-bottom-right-radius: 4px;
    }
    .msg.me {
      align-self: flex-end;
      background: var(--bubble-me);
      border-bottom-left-radius: 4px;
    }
    .msg .meta { font-size: 11px; color: var(--hint); margin-top: 6px; }
    .composer {
      display: flex;
      gap: 8px;
      padding: 10px 12px calc(10px + env(safe-area-inset-bottom));
      background: var(--sec);
      border-top: 1px solid rgba(255,255,255,0.06);
    }
    #input {
      flex: 1;
      resize: none;
      border: none;
      border-radius: 12px;
      padding: 12px;
      font-size: 15px;
      font-family: inherit;
      background: var(--bg);
      color: var(--text);
      min-height: 48px;
      max-height: 120px;
      outline: none;
    }
    #send {
      border: none;
      border-radius: 12px;
      padding: 0 16px;
      background: var(--btn);
      color: var(--btn-text);
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      min-width: 64px;
    }
    #send:disabled { opacity: 0.5; cursor: not-allowed; }
    .rules {
      font-size: 12px;
      color: var(--hint);
    }
    .rules strong { color: var(--text); }
  </style>
</head>
<body>
  <header>
    <h1>💬 ارسال پیام به آرال</h1>
    <p class="rules">
      با <strong>صدام بزن</strong> / <strong>این کاربر</strong> / <strong>تو زندگی بعدی</strong> شروع کنید،
      بدون لینک و ایموجی، و با نقطه تمام شود. حداکثر ۶ پیام در ۱۰ دقیقه.
    </p>
  </header>
  <div id="chat"></div>
  <div class="composer">
    <textarea id="input" rows="1" placeholder="مثلاً: صدام بزن آ مهتی چون دوستت دارم ."></textarea>
    <button type="button" id="send">ارسال</button>
  </div>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();
      try { tg.setHeaderColor('secondary_bg_color'); } catch (e) {}
    }

    const chat = document.getElementById('chat');
    const input = document.getElementById('input');
    const sendBtn = document.getElementById('send');

    function addMsg(text, who, meta) {
      const el = document.createElement('div');
      el.className = 'msg ' + (who === 'me' ? 'me' : 'bot');
      el.textContent = text;
      if (meta) {
        const m = document.createElement('div');
        m.className = 'meta';
        m.textContent = meta;
        el.appendChild(m);
      }
      chat.appendChild(el);
      chat.scrollTop = chat.scrollHeight;
    }

    addMsg(
      'سلام 👋\nمثل یک گفتگو بنویس و بفرست.\n\nنمونه:\nصدام بزن آ مهتی چون دوستت دارم .',
      'bot'
    );

    function callEndpoint(name, payload) {
      return new Promise(function (resolve, reject) {
        if (!tg || !tg.Serverless || typeof tg.Serverless.call !== 'function') {
          reject(new Error('این صفحه را از داخل ربات تلگرام باز کنید.'));
          return;
        }
        tg.Serverless.call(name, payload || {}, function (err, result) {
          if (err) {
            var msg = (err && err.message) || 'خطا';
            reject(Object.assign(new Error(msg), { parameters: err.parameters, type: err.type }));
            return;
          }
          resolve(result);
        });
      });
    }

    async function loadHistory() {
      try {
        var res = await callEndpoint('getMyMessages', { limit: 10 });
        if (res && res.items && res.items.length) {
          addMsg('— پیام‌های اخیر شما —', 'bot');
          res.items.slice().reverse().forEach(function (it) {
            addMsg(
              (it.content || '') + '\n' + (it.statusLabel || it.status),
              'me',
              '#' + it.id + (it.when ? ' · ' + it.when : '')
            );
          });
        }
      } catch (e) {
        /* اختیاری */
      }
    }

    async function send() {
      var text = (input.value || '').trim();
      if (!text) return;
      sendBtn.disabled = true;
      addMsg(text, 'me');
      input.value = '';
      try {
        var res = await callEndpoint('submitMessage', { text: text });
        addMsg(res.message || ('ثبت شد #' + res.msgId), 'bot');
        if (tg && tg.HapticFeedback) {
          try { tg.HapticFeedback.notificationOccurred('success'); } catch (e) {}
        }
      } catch (err) {
        addMsg('❌ ' + (err.message || 'خطا در ثبت'), 'bot');
        if (tg && tg.HapticFeedback) {
          try { tg.HapticFeedback.notificationOccurred('error'); } catch (e) {}
        }
      } finally {
        sendBtn.disabled = false;
        input.focus();
      }
    }

    sendBtn.addEventListener('click', send);
    input.addEventListener('keydown', function (e) {
      if (e.key === 'Enter' && !e.shiftKey) {
        e.preventDefault();
        send();
      }
    });

    loadHistory();
  </script>
</body>
</html>
